; H3S-Dev (ESP32-S3 + SX1262 / Ra-01SH-P) - Meshtastic variant
; Lives in hobbyiot/H3S-Dev-V1 (Meshtastic/variant/h3s_dev) and is linked into meshtastic/firmware at
; variants/esp32s3/h3s_dev by Meshtastic/link_variant.sh.

[env:h3s-dev]
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_display_name = H3S-Dev
custom_meshtastic_tags = hobbyiot
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB

extends = esp32s3_base
board = h3s_dev
board_level = extra
board_build.partitions = default_16MB.csv
build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -D VTABLES_IN_FLASH=1
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -O2
  -I variants/esp32s3/h3s_dev
board_build.f_cpu = 240000000L
upload_protocol = esptool
upload_speed = 921600
lib_deps =
  ${esp32s3_base.lib_deps}
